<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- shell:begin -->
    <!-- shell:fade:begin -->
    <style>
      html { background: #05070a; }
      html[data-fade]::after { content: ""; position: fixed; inset: 0; z-index: 2147483647; background: #05070a; pointer-events: none; }
      html[data-fade="in"]::after { animation: shell-fade-release 600ms ease 4000ms forwards; }
      html[data-fade="out"]::after { animation: shell-fade-out 400ms ease forwards; }
      html[data-fade="release"]::after { animation: shell-fade-release 600ms ease forwards; }
      @keyframes shell-fade-out { from { opacity: 0; } to { opacity: 1; } }
      @keyframes shell-fade-release { from { opacity: 1; } to { opacity: 0; } }
    </style>
    <script>
      try {
        var raw = sessionStorage.getItem('jg:fade')
        sessionStorage.removeItem('jg:fade')
        var age = Date.now() - Number(raw)
        if (raw !== null && isFinite(age) && age >= 0 && age < 5000 && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.setAttribute('data-fade', 'in')
      } catch (error) {}
    </script>
    <!-- shell:fade:end -->
    <!-- shell:end -->
    <!-- Theme before first paint: stored choice, else the system preference. Never throws. -->
    <style>
      html[data-theme="light"] { background: #f4f1ea; color-scheme: light; }
      html[data-theme="dark"] { background: #0b1622; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('sm:theme') } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          try { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch (error) { theme = 'light' }
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Armament: rifle receivers and small-arms parts, drawn for the machine shop. Page under construction." />
    <link rel="canonical" href="https://studiomark.dev/armament/" />
    <link rel="preload" href="/fonts/home/Michroma.woff2" as="font" type="font/woff2" crossorigin />
    <title>Armament · Under construction · Mark Hintz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/armament-main.tsx"></script>
  </body>
</html>
